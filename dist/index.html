    <script>
      (function () {
        var sliderDone = false;
        var IMAGES = [
          'https://images.unsplash.com/photo-1637137659416-d8112dbc46d7?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1440',
          'https://images.unsplash.com/photo-1622621944707-e2e31c4e5695?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1440',
          'https://images.unsplash.com/photo-1673201229733-69d19c5c4a87?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1440',
          'https://images.unsplash.com/photo-1693743472699-a0264203ac56?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1440',
          'https://images.unsplash.com/photo-1760080838961-4208536db385?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1440'
        ];

        function injectSlider() {
          if (sliderDone) return;
          var heroImg = document.querySelector('img[src*="photo-1637137659416"]');
          if (!heroImg) return;
          var container = heroImg.parentElement;
          if (!container) return;

          var style = document.createElement('style');
          style.textContent =
            '@keyframes mt-fade{0%{opacity:1}' +
            '18%{opacity:1}20%{opacity:0}98%{opacity:0}100%{opacity:1}}' +
            '.mt-slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.08);opacity:0;animation:mt-fade ' + (IMAGES.length * 4) + 's linear infinite;}';
          document.head.appendChild(style);

          heroImg.style.display = 'none';

          IMAGES.forEach(function (src, idx) {
            var img = document.createElement('img');
            img.src = src;
            img.alt = 'Modern Tailors Santacruz Mumbai';
            img.className = 'mt-slide';
            img.style.animationDelay = (-((IMAGES.length - idx) * 4 - 4)) + 's';
            container.insertBefore(img, container.firstChild);
          });

          sliderDone = true;
        }

        var sliderInterval = setInterval(function () {
          injectSlider();
          if (sliderDone) clearInterval(sliderInterval);
        }, 200);
        setTimeout(function () { clearInterval(sliderInterval); }, 10000);

        var sliderObs = new MutationObserver(function () {
          if (!sliderDone) injectSlider();
        });
        sliderObs.observe(document.body, { childList: true, subtree: true });
      })();

    <script>
      (function () {
        var sloganDone = false;
        var footerDone = false;

        function injectSlogan() {
          if (window.location.pathname !== '/') { sloganDone = false; return; }
          if (sloganDone) return;

          var descPara = null;
          var paras = document.querySelectorAll('p');
          for (var i = 0; i < paras.length; i++) {
            if (paras[i].textContent.indexOf('Custom tailoring for men') !== -1) {
              descPara = paras[i];
              break;
            }
          }
          if (!descPara) return;

          var allEls = document.querySelectorAll('h1,h2,h3,h4,h5,h6,div,span');
          for (var j = 0; j < allEls.length; j++) {
            var t = allEls[j].childNodes;
            var direct = '';
            for (var k = 0; k < t.length; k++) {
              if (t[k].nodeType === 3) direct += t[k].textContent;
            }
            if (direct.indexOf('Clothes That Fit') !== -1 || allEls[j].textContent.trim() === 'Every Single Time.') {
              allEls[j].style.display = 'none';
            }
          }

          var existing = document.querySelector('[data-mt-slogan]');
          if (existing) { sloganDone = true; return; }

          var slogan = document.createElement('h1');
          slogan.setAttribute('data-mt-slogan', '1');
          slogan.style.cssText = 'font-family:Georgia,serif;font-size:clamp(2.6rem,6vw,4.5rem);font-weight:800;color:#fff;line-height:1.1;margin-bottom:0.5rem;font-style:normal;text-shadow:0 2px 16px rgba(0,0,0,0.35);letter-spacing:-0.01em;';
          slogan.innerHTML = 'God made a man,<br>but the tailor<br>made him a <em style="color:#f5a623;font-style:normal;">Gentleman.</em>';
          descPara.parentNode.insertBefore(slogan, descPara);
          sloganDone = true;
        }

        function injectFooterInfo() {
          if (footerDone) return;
          var footer = document.querySelector('footer');
          if (!footer) return;
          var firstCol = footer.querySelector('[class*="md:col-span-1"]');
          if (!firstCol) return;
          var existing = firstCol.querySelector('[data-mt-owner]');
          if (existing) { footerDone = true; return; }
          var ownerBlock = document.createElement('div');
          ownerBlock.setAttribute('data-mt-owner', '1');
          ownerBlock.style.cssText = 'margin-top:0.75rem;font-size:0.85rem;line-height:1.7;color:rgba(255,255,255,0.7);';
          ownerBlock.innerHTML =
            '<span style="display:block;color:rgba(255,255,255,0.55);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.2rem;">Proprietor</span>' +
            '<span style="display:block;font-weight:600;color:rgba(255,255,255,0.9);">Fazal Shaikh</span>' +
            '<a href="mailto:modernbespoketailor@gmail.com" style="display:block;color:rgba(245,166,35,0.9);text-decoration:none;word-break:break-all;margin-top:0.2rem;">modernbespoketailor@gmail.com</a>';
          firstCol.appendChild(ownerBlock);
          footerDone = true;
        }

        function runAll() {
          injectSlogan();
          injectFooterInfo();
        }

        var interval = setInterval(runAll, 200);
        setTimeout(function () { clearInterval(interval); }, 10000);

        var obs = new MutationObserver(runAll);
        obs.observe(document.body, { childList: true, subtree: true });

        var origPush = history.pushState.bind(history);
        history.pushState = function () {
          origPush.apply(this, arguments);
          sloganDone = false;
          footerDone = false;
          clearInterval(interval);
          interval = setInterval(runAll, 200);
          setTimeout(function () { clearInterval(interval); }, 10000);
        };
        window.addEventListener('popstate', function () {
          sloganDone = false;
          footerDone = false;
        });
      })();
    </script>
    <script>
      (function () {
        var searchDone = false;

        function injectSearch() {
          if (window.location.pathname !== '/gallery') {
            searchDone = false;
            removeSearch();
            return;
          }
          if (searchDone) return;

          /* Find the filter-button row by looking for the "All" button */
          var allBtn = null;
          var btns = document.querySelectorAll('button');
          for (var i = 0; i < btns.length; i++) {
            if (btns[i].textContent.trim() === 'All') {
              allBtn = btns[i];
              break;
            }
          }
          if (!allBtn) return;

          var filterRow = allBtn.closest('div') || allBtn.parentElement;
          if (!filterRow) return;

          /* Don't double-inject */
          if (document.getElementById('mt-gallery-search')) { searchDone = true; return; }

          /* Build wrapper */
          var wrapper = document.createElement('div');
          wrapper.id = 'mt-gallery-search-wrapper';
          wrapper.style.cssText = [
            'display:flex',
            'align-items:center',
            'justify-content:center',
            'padding:1.25rem 1.5rem 0.5rem',
            'background:#fff'
          ].join(';');

          var inputWrap = document.createElement('div');
          inputWrap.style.cssText = [
            'position:relative',
            'width:100%',
            'max-width:480px'
          ].join(';');

          /* Search icon */
          var icon = document.createElement('span');
          icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="#9ca3af" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
          icon.style.cssText = 'position:absolute;left:0.85rem;top:50%;transform:translateY(-50%);pointer-events:none;display:flex;align-items:center;';

          var input = document.createElement('input');
          input.id = 'mt-gallery-search';
          input.type = 'text';
          input.placeholder = 'Search outfits — e.g. lehenga, blazer, saree…';
          input.style.cssText = [
            'width:100%',
            'padding:0.65rem 1rem 0.65rem 2.75rem',
            'border:1.5px solid #e5e7eb',
            'border-radius:9999px',
            'font-size:0.95rem',
            'color:#1a1a2e',
            'background:#f9fafb',
            'outline:none',
            'transition:border-color 0.2s',
            'box-sizing:border-box'
          ].join(';');

          input.addEventListener('focus', function () { this.style.borderColor = '#f5a623'; });
          input.addEventListener('blur', function () { this.style.borderColor = '#e5e7eb'; });

          /* Clear button */
          var clearBtn = document.createElement('button');
          clearBtn.id = 'mt-gallery-clear';
          clearBtn.innerHTML = '&times;';
          clearBtn.style.cssText = [
            'position:absolute',
            'right:0.75rem',
            'top:50%',
            'transform:translateY(-50%)',
            'background:none',
            'border:none',
            'cursor:pointer',
            'font-size:1.2rem',
            'color:#9ca3af',
            'line-height:1',
            'padding:0',
            'display:none'
          ].join(';');
          clearBtn.addEventListener('click', function () {
            input.value = '';
            filterGallery('');
            this.style.display = 'none';
          });

          inputWrap.appendChild(icon);
          inputWrap.appendChild(input);
          inputWrap.appendChild(clearBtn);
          wrapper.appendChild(inputWrap);

          filterRow.parentElement.insertBefore(wrapper, filterRow);

          input.addEventListener('input', function () {
            var q = this.value.trim();
            clearBtn.style.display = q ? 'block' : 'none';
            filterGallery(q);
          });

          searchDone = true;
        }

        function filterGallery(query) {
          var q = query.toLowerCase();

          /* Gallery cards — each has an <img> with an alt text and a text label */
          var cards = document.querySelectorAll('[class*="group"] img, [class*="card"] img, .gallery-item img');
          /* Fallback: find all gallery images by looking for grid items */
          if (!cards || cards.length === 0) {

        function applyGalleryFilter() {
          if (window.location.pathname !== '/gallery') return;
          var q = new URLSearchParams(window.location.search).get('q');
          if (!q) return;
          var attempts = 0;
          var t = setInterval(function () {

              if (clr) clr.style.display = 'block';
            }

          }, 100);
        }

        // ── Inject service links ──────────────────────────────
        function injectServiceLinks() {
          if (window.location.pathname !== '/services') return;
          var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
          var node;
          while ((node = walker.nextNode())) {

            if (!q) continue;
            var el = node.parentElement;
            if (!el || el.closest('a') || el.dataset.glk) continue;
            el.dataset.glk = '1';
            el.style.cursor = 'pointer';
            el.style.textDecoration = 'underline';
            el.style.textDecorationColor = 'rgba(184,150,46,0.6)';
            el.style.textUnderlineOffset = '3px';
            el.title = 'See in Gallery';
            el.addEventListener('click', (function (query) {
              return function (e) {
                e.preventDefault();
                e.stopPropagation();
                window.location.href = '/gallery?q=' + encodeURIComponent(query);
              };
            }(q)));
          }
        }

        // ── Hook into React Router navigation ────────────────
        var _push = history.pushState.bind(history);
        history.pushState = function () {
          _push.apply(this, arguments);
          applyGalleryFilter();
          setTimeout(injectServiceLinks, 400);
        };
        window.addEventListener('popstate', function () {
          applyGalleryFilter();
          setTimeout(injectServiceLinks, 400);
        });

        // ── Watch DOM for late-rendered content ───────────────
        new MutationObserver(function () {
          if (window.location.pathname === '/services') injectServiceLinks();
        }).observe(document.body, { childList: true, subtree: true });

        applyGalleryFilter();
        setTimeout(injectServiceLinks, 600);
      })();

          avatar.innerHTML = '<span style="color:#fff;font-size:15px;font-weight:700;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif;">' + initials + '</span>';

          var info = document.createElement('div');
          var nameEl = document.createElement('p');
          nameEl.style.cssText = 'font-size:14px;font-weight:700;color:#111827;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;';
          nameEl.textContent = t.name;
          var locEl = document.createElement('p');
          locEl.style.cssText = 'font-size:12px;color:#9ca3af;margin:2px 0 0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;';
          locEl.textContent = t.location + ', Mumbai';
          info.appendChild(nameEl);
          info.appendChild(locEl);

          meta.appendChild(avatar);
          meta.appendChild(info);

          card.appendChild(quote);
          card.appendChild(text);
          card.appendChild(stars);
          card.appendChild(meta);
          return card;
        }

        function injectTestimonials() {
          if (testimonialsDone) return;
          if (window.location.pathname !== '/') { testimonialsDone = false; return; }

          if (document.querySelector('[data-mt-testimonials]')) { testimonialsDone = true; return; }
          // Find the steps section by hercules-id or by heading text fallback
          var section = document.querySelector('[data-hercules-id="src/pages/Index.tsx:431:8"]') ||
                        document.querySelector('[data-hercules-id="src/pages/Index.tsx:430:8"]');
          if (!section) {
            // Fallback: find by heading text content
            var allH = document.querySelectorAll('h2, h3');
            for (var hi = 0; hi < allH.length; hi++) {
              if (allH[hi].textContent.indexOf('Getting Your Outfit') !== -1) {
                var n = allH[hi];
                for (var u = 0; u < 8; u++) {
                  if (!n.parentElement) break;
                  n = n.parentElement;
                  if (n.tagName.toLowerCase() === 'section') { section = n; break; }
                }
                break;
              }
            }
          }
          if (!section) return;

          var wrapper = document.createElement('section');
          wrapper.setAttribute('data-mt-testimonials', '1');
          wrapper.style.cssText = 'background:#f9f7f2;padding:80px 0;border-top:1px solid rgba(184,150,46,0.12);';

          var inner = document.createElement('div');
          inner.style.cssText = 'max-width:1100px;margin:0 auto;padding:0 24px;';

          var eyebrow = document.createElement('p');
          eyebrow.style.cssText = 'text-align:center;font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:' + GOLD + ';margin-bottom:12px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;';
          eyebrow.textContent = 'Happy Customers';

          var title = document.createElement('h2');
          title.style.cssText = 'text-align:center;font-size:clamp(24px,4vw,38px);font-weight:700;color:#111827;margin-bottom:10px;font-family:Georgia,"Times New Roman",serif;letter-spacing:-0.01em;';
          title.textContent = 'What Our Customers Say';

          var subtitle = document.createElement('p');
          subtitle.style.cssText = 'text-align:center;font-size:15px;color:#6b7280;margin-bottom:52px;max-width:460px;margin-left:auto;margin-right:auto;line-height:1.6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;';
          subtitle.textContent = 'Thousands of happy customers across Mumbai trust us with their most special occasions.';

          /* Carousel container */
          var carouselOuter = document.createElement('div');
          carouselOuter.style.cssText = 'max-width:520px;margin:0 auto;position:relative;';

          var track = document.createElement('div');
          track.setAttribute('data-mt-track', '1');
          track.style.cssText = 'position:relative;min-height:280px;';

          var cards = testimonials.map(function(t, i) {
            return buildCard(t, i === 0);
          });
          cards.forEach(function(c) { track.appendChild(c); });

          /* Dot indicators */
          var dots = document.createElement('div');
          dots.style.cssText = 'display:flex;justify-content:center;gap:8px;margin-top:28px;';
          var dotEls = testimonials.map(function(_, i) {
            var d = document.createElement('button');
            d.style.cssText = 'width:' + (i===0?'24px':'8px') + ';height:8px;border-radius:999px;border:none;cursor:pointer;background:' + (i===0?GOLD:'#d1d5db') + ';transition:all 0.3s;padding:0;';
            d.setAttribute('aria-label', 'Review ' + (i+1));
            d.addEventListener('click', function() { goTo(i); });
            return d;
          });
          dotEls.forEach(function(d) { dots.appendChild(d); });

          /* Nav arrows */
          var prevBtn = document.createElement('button');
          prevBtn.style.cssText = 'position:absolute;top:50%;left:-52px;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(184,150,46,0.35);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.08);transition:border-color 0.2s,box-shadow 0.2s;color:#374151;font-size:16px;';
          prevBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
          prevBtn.setAttribute('aria-label', 'Previous review');
          prevBtn.onmouseenter = function() { this.style.borderColor=GOLD; this.style.boxShadow='0 4px 16px rgba(184,150,46,0.25)'; };
          prevBtn.onmouseleave = function() { this.style.borderColor='rgba(184,150,46,0.35)'; this.style.boxShadow='0 2px 8px rgba(0,0,0,0.08)'; };

          var nextBtn = document.createElement('button');
          nextBtn.style.cssText = 'position:absolute;top:50%;right:-52px;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(184,150,46,0.35);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.08);transition:border-color 0.2s,box-shadow 0.2s;color:#374151;font-size:16px;';
          nextBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
          nextBtn.setAttribute('aria-label', 'Next review');
          nextBtn.onmouseenter = function() { this.style.borderColor=GOLD; this.style.boxShadow='0 4px 16px rgba(184,150,46,0.25)'; };
          nextBtn.onmouseleave = function() { this.style.borderColor='rgba(184,150,46,0.35)'; this.style.boxShadow='0 2px 8px rgba(0,0,0,0.08)'; };

          function goTo(idx) {
            var prev = currentIndex;
            currentIndex = (idx + testimonials.length) % testimonials.length;
            cards[prev].style.opacity = '0';
            cards[prev].style.transform = 'scale(0.96)';
            cards[prev].style.pointerEvents = 'none';
            cards[currentIndex].style.opacity = '1';
            cards[currentIndex].style.transform = 'scale(1)';
            cards[currentIndex].style.pointerEvents = 'auto';
            dotEls[prev].style.width = '8px';
            dotEls[prev].style.background = '#d1d5db';
            dotEls[currentIndex].style.width = '24px';
            dotEls[currentIndex].style.background = GOLD;
            resetAuto();
          }

          function resetAuto() {
            if (autoTimer) clearInterval(autoTimer);
            autoTimer = setInterval(function() { goTo(currentIndex + 1); }, 5000);
          }

          prevBtn.addEventListener('click', function() { goTo(currentIndex - 1); });
          nextBtn.addEventListener('click', function() { goTo(currentIndex + 1); });

          carouselOuter.appendChild(prevBtn);
          carouselOuter.appendChild(track);
          carouselOuter.appendChild(nextBtn);

          /* Overall rating bar */
          var ratingBar = document.createElement('div');
          ratingBar.style.cssText = 'display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:40px;flex-wrap:wrap;';
          var bigStars = document.createElement('div');
          bigStars.style.cssText = 'display:flex;gap:3px;';
          bigStars.innerHTML = starHTML(5);
          var bigStarsStyle = bigStars.querySelectorAll('svg');
          bigStarsStyle.forEach(function(s) { s.setAttribute('width','22'); s.setAttribute('height','22'); });
          var ratingText = document.createElement('span');
          ratingText.style.cssText = 'font-size:15px;color:#374151;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:600;';
          ratingText.textContent = '5.0 out of 5 \u2022 Based on 200+ happy customers';
          ratingBar.appendChild(bigStars);
          ratingBar.appendChild(ratingText);

          inner.appendChild(eyebrow);
          inner.appendChild(title);
          inner.appendChild(subtitle);
          inner.appendChild(ratingBar);
          inner.appendChild(carouselOuter);
          inner.appendChild(dots);
          wrapper.appendChild(inner);

          section.parentNode.insertBefore(wrapper, section);
          testimonialsDone = true;
          resetAuto();
        }

        var tInterval = setInterval(injectTestimonials, 200);
        setTimeout(function() { clearInterval(tInterval); }, 10000);
        new MutationObserver(function() {
          if (window.location.pathname === '/') injectTestimonials();
        }).observe(document.body, { childList: true, subtree: true });

        var _tPush = history.pushState.bind(history);
        history.pushState = history.pushState.__mt_patchedT ? history.pushState : (function(orig) {
          var fn = function() {
            orig.apply(this, arguments);
            testimonialsDone = false;
            clearInterval(tInterval);
            if (autoTimer) clearInterval(autoTimer);
            if (window.location.pathname === '/') {
              var i2 = setInterval(injectTestimonials, 200);
              setTimeout(function() { clearInterval(i2); }, 10000);
            }
          };
          fn.__mt_patchedT = true;
          return fn;
        })(_tPush);
        window.addEventListener('popstate', function() { testimonialsDone = false; if (autoTimer) clearInterval(autoTimer); });
      })();
    </script>
    <script>
      (function () {
        fetch('/offers').then(function (r) { return r.json(); }).then(function (data) {
          if (!data.enabled || !data.items || data.items.length === 0) return;

          var style = document.createElement('style');
          style.textContent = [
            '@keyframes mt-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }',
            '#mt-ticker-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; height: 38px; display: flex; align-items: center; overflow: hidden; }',
            '#mt-ticker-track { display: flex; align-items: center; white-space: nowrap; animation: mt-scroll 40s linear infinite; }',
            '#mt-ticker-bar:hover #mt-ticker-track { animation-play-state: paused; cursor: default; }'
          ].join('');
          document.head.appendChild(style);

          var bar = document.createElement('div');
          bar.id = 'mt-ticker-bar';
          bar.style.background = data.bgColor || '#b8962e';
          bar.style.color = data.textColor || '#ffffff';
          bar.style.fontSize = '13px';
          bar.style.fontWeight = '600';
          bar.style.fontFamily = '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
          bar.style.letterSpacing = '0.01em';

          var track = document.createElement('div');
          track.id = 'mt-ticker-track';

          var doubled = data.items.concat(data.items);
          doubled.forEach(function (item) {
            var span = document.createElement('span');
            span.style.padding = '0 52px';
            span.innerHTML = '✦&nbsp;&nbsp;' + item;
            track.appendChild(span);
          });

          bar.appendChild(track);
          document.body.insertBefore(bar, document.body.firstChild);

          var TICKER_H = 38;

          var navStyle = document.createElement('style');
          navStyle.id = 'mt-ticker-nav-fix';
          navStyle.textContent =
            'nav.fixed, header.fixed, [class*="fixed"][class*="top-0"]:not(#mt-ticker-bar) { top: ' + TICKER_H + 'px !important; }';
          document.head.appendChild(navStyle);

          var root = document.getElementById('root');
          if (root) root.style.paddingTop = TICKER_H + 'px';
        }).catch(function () {});
      })();
    </script>
