    <script>
      (function () {
        var sliderDone = false;
        var IMAGES = [
          'https://images.unsplash.com/photo-1637137659416-d8112dbc46d7?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1440',

          'https://images.unsplash.com/photo-1693743472699-a0264203ac56?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1440',
          'https://images.unsplash.com/photo-1760080838961-4208536db385?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&w=1440'

        function injectSlider() {
          if (sliderDone) return;
          var heroImg = document.querySelector('img[src*="photo-1637137659416"]');
          if (!heroImg) return;
          var container = heroImg.parentElement;
          if (!container) return;

          var style = document.createElement('style');
          style.textContent =
            '@keyframes mt-fade{0%{opacity:1}' +
            '18%{opacity:1}20%{opacity:0}98%{opacity:0}100%{opacity:1}}' +

          document.head.appendChild(style);

          IMAGES.forEach(function (src, idx) {
            var img = document.createElement('img');
            img.src = src;
            img.alt = 'Modern Tailors Santacruz Mumbai';
            img.className = 'mt-slide';

          sliderDone = true;
        }

        var sliderInterval = setInterval(function () {
          injectSlider();
          if (sliderDone) clearInterval(sliderInterval);
        }, 200);
        setTimeout(function () { clearInterval(sliderInterval); }, 10000);

        var sliderObs = new MutationObserver(function () {
          if (!sliderDone) injectSlider();
        });
        sliderObs.observe(document.body, { childList: true, subtree: true });
      })();

    <script>
      (function () {
        var sloganDone = false;
        var footerDone = false;

        function injectSlogan() {
          if (window.location.pathname !== '/') { sloganDone = false; return; }
          if (sloganDone) return;

          var descPara = null;
          var paras = document.querySelectorAll('p');
          for (var i = 0; i < paras.length; i++) {
            if (paras[i].textContent.indexOf('Custom tailoring for men') !== -1) {
              descPara = paras[i];
              break;
            }
          }
          if (!descPara) return;

          var allEls = document.querySelectorAll('h1,h2,h3,h4,h5,h6,div,span');
          for (var j = 0; j < allEls.length; j++) {
            var t = allEls[j].childNodes;
            var direct = '';
            for (var k = 0; k < t.length; k++) {
              if (t[k].nodeType === 3) direct += t[k].textContent;
            }
            if (direct.indexOf('Clothes That Fit') !== -1 || allEls[j].textContent.trim() === 'Every Single Time.') {
              allEls[j].style.display = 'none';
            }
          }

          var existing = document.querySelector('[data-mt-slogan]');
          if (existing) { sloganDone = true; return; }

          var slogan = document.createElement('h1');
          slogan.setAttribute('data-mt-slogan', '1');
          slogan.style.cssText = 'font-family:Georgia,serif;font-size:clamp(2.6rem,6vw,4.5rem);font-weight:800;color:#fff;line-height:1.1;margin-bottom:0.5rem;font-style:normal;text-shadow:0 2px 16px rgba(0,0,0,0.35);letter-spacing:-0.01em;';
          slogan.innerHTML = 'God made a man,<br>but the tailor<br>made him a <em style="color:#f5a623;font-style:normal;">Gentleman.</em>';
          descPara.parentNode.insertBefore(slogan, descPara);
          sloganDone = true;
        }

        function injectFooterInfo() {
          if (footerDone) return;
          var footer = document.querySelector('footer');
          if (!footer) return;
          var firstCol = footer.querySelector('[class*="md:col-span-1"]');
          if (!firstCol) return;
          var existing = firstCol.querySelector('[data-mt-owner]');
          if (existing) { footerDone = true; return; }
          var ownerBlock = document.createElement('div');
          ownerBlock.setAttribute('data-mt-owner', '1');
          ownerBlock.style.cssText = 'margin-top:0.75rem;font-size:0.85rem;line-height:1.7;color:rgba(255,255,255,0.7);';
          ownerBlock.innerHTML =
            '<span style="display:block;color:rgba(255,255,255,0.55);font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.2rem;">Proprietor</span>' +
            '<span style="display:block;font-weight:600;color:rgba(255,255,255,0.9);">Fazal Shaikh</span>' +
            '<a href="mailto:modernbespoketailor@gmail.com" style="display:block;color:rgba(245,166,35,0.9);text-decoration:none;word-break:break-all;margin-top:0.2rem;">modernbespoketailor@gmail.com</a>';
          firstCol.appendChild(ownerBlock);
          footerDone = true;
        }

        function runAll() {
          injectSlogan();
          injectFooterInfo();
        }

        var interval = setInterval(runAll, 200);
        setTimeout(function () { clearInterval(interval); }, 10000);

        var obs = new MutationObserver(runAll);
        obs.observe(document.body, { childList: true, subtree: true });

        var origPush = history.pushState.bind(history);
        history.pushState = function () {
          origPush.apply(this, arguments);
          sloganDone = false;
          footerDone = false;
          clearInterval(interval);
          interval = setInterval(runAll, 200);
          setTimeout(function () { clearInterval(interval); }, 10000);
        };
        window.addEventListener('popstate', function () {
          sloganDone = false;
          footerDone = false;
        });
      })();
    </script>
    <script>
      (function () {
        var searchDone = false;

        function injectSearch() {
          if (window.location.pathname !== '/gallery') {
            searchDone = false;
            removeSearch();
            return;
          }
          if (searchDone) return;

          /* Find the filter-button row by looking for the "All" button */
          var allBtn = null;
          var btns = document.querySelectorAll('button');
          for (var i = 0; i < btns.length; i++) {
            if (btns[i].textContent.trim() === 'All') {
              allBtn = btns[i];
              break;
            }
          }
          if (!allBtn) return;

          var filterRow = allBtn.closest('div') || allBtn.parentElement;
          if (!filterRow) return;

          /* Don't double-inject */
          if (document.getElementById('mt-gallery-search')) { searchDone = true; return; }

          /* Build wrapper */
          var wrapper = document.createElement('div');
          wrapper.id = 'mt-gallery-search-wrapper';
          wrapper.style.cssText = [
            'display:flex',
            'align-items:center',
            'justify-content:center',
            'padding:1.25rem 1.5rem 0.5rem',
            'background:#fff'
          ].join(';');

          var inputWrap = document.createElement('div');
          inputWrap.style.cssText = [
            'position:relative',
            'width:100%',
            'max-width:480px'
          ].join(';');

          /* Search icon */
          var icon = document.createElement('span');
          icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="#9ca3af" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
          icon.style.cssText = 'position:absolute;left:0.85rem;top:50%;transform:translateY(-50%);pointer-events:none;display:flex;align-items:center;';

          var input = document.createElement('input');
          input.id = 'mt-gallery-search';
          input.type = 'text';
          input.placeholder = 'Search outfits — e.g. lehenga, blazer, saree…';
          input.style.cssText = [
            'width:100%',
            'padding:0.65rem 1rem 0.65rem 2.75rem',
            'border:1.5px solid #e5e7eb',
            'border-radius:9999px',
            'font-size:0.95rem',
            'color:#1a1a2e',
            'background:#f9fafb',
            'outline:none',
            'transition:border-color 0.2s',
            'box-sizing:border-box'
          ].join(';');

          input.addEventListener('focus', function () { this.style.borderColor = '#f5a623'; });
          input.addEventListener('blur', function () { this.style.borderColor = '#e5e7eb'; });

          /* Clear button */
          var clearBtn = document.createElement('button');
          clearBtn.id = 'mt-gallery-clear';
          clearBtn.innerHTML = '&times;';
          clearBtn.style.cssText = [
            'position:absolute',
            'right:0.75rem',
            'top:50%',
            'transform:translateY(-50%)',
            'background:none',
            'border:none',
            'cursor:pointer',
            'font-size:1.2rem',
            'color:#9ca3af',
            'line-height:1',
            'padding:0',
            'display:none'
          ].join(';');
          clearBtn.addEventListener('click', function () {
            input.value = '';
            filterGallery('');
            this.style.display = 'none';
          });

          inputWrap.appendChild(icon);
          inputWrap.appendChild(input);
          inputWrap.appendChild(clearBtn);
          wrapper.appendChild(inputWrap);

          filterRow.parentElement.insertBefore(wrapper, filterRow);

          input.addEventListener('input', function () {
            var q = this.value.trim();
            clearBtn.style.display = q ? 'block' : 'none';
            filterGallery(q);
          });

          searchDone = true;
        }

        function filterGallery(query) {
          var q = query.toLowerCase();

          /* Gallery cards — each has an <img> with an alt text and a text label */
          var cards = document.querySelectorAll('[class*="group"] img, [class*="card"] img, .gallery-item img');
          /* Fallback: find all gallery images by looking for grid items */
          if (!cards || cards.length === 0) {
            /* Try to find gallery grid items — they contain an img */
            var allImgs = document.querySelectorAll('img[alt]');
            cards = [];
            for (var x = 0; x < allImgs.length; x++) {
              var src = allImgs[x].getAttribute('src') || '';
              if (src.indexOf('/images/') !== -1 || src.indexOf('unsplash') !== -1) {
                cards.push(allImgs[x]);
              }
            }
          }

          /* Walk up to find the card container (usually 3-4 levels up from the img) */
          var sectionMap = {};

          for (var i = 0; i < cards.length; i++) {
            var img = cards[i];
            var alt = (img.getAttribute('alt') || '').toLowerCase();

            /* Also grab the label text from within the card */
            var cardEl = img;
            for (var up = 0; up < 5; up++) {
              if (cardEl.parentElement) cardEl = cardEl.parentElement;
              else break;
              /* Stop when we hit something that looks like a standalone card */
              if (cardEl.children.length >= 1 && cardEl.querySelector('img') && cardEl.offsetHeight > 100) break;
            }

            var labelText = '';
            var textEls = cardEl.querySelectorAll('p, span, h3, h4');
            for (var t = 0; t < textEls.length; t++) {
              labelText += ' ' + textEls[t].textContent.toLowerCase();
            }

            var haystack = alt + ' ' + labelText;
            var visible = !q || haystack.indexOf(q) !== -1;
            cardEl.style.display = visible ? '' : 'none';

            /* Track section headers — try to find the section heading for this card */
            var sectionHead = null;
            var node = cardEl;
            for (var s = 0; s < 10; s++) {
              node = node.parentElement;
              if (!node) break;
              var hd = node.querySelector('h2, h3');
              if (hd) { sectionHead = hd; break; }
            }
            if (sectionHead) {
              var key = sectionHead.textContent.trim();
              if (!sectionMap[key]) sectionMap[key] = { head: sectionHead, visible: 0, total: 0 };
              sectionMap[key].total++;
              if (visible) sectionMap[key].visible++;
            }
          }

          /* Show/hide section headers based on whether any cards are visible */
          for (var k in sectionMap) {
            var sec = sectionMap[k];
            /* Go up to the section wrapper to hide it entirely */
            var secWrapper = sec.head.parentElement;
            while (secWrapper && !secWrapper.querySelector('img')) {
              secWrapper = secWrapper.parentElement;
            }
            if (secWrapper) {
              secWrapper.style.display = sec.visible === 0 ? 'none' : '';
            }
          }

          /* Show "no results" message */
          var noResults = document.getElementById('mt-no-results');
          if (!noResults) {
            noResults = document.createElement('div');
            noResults.id = 'mt-no-results';
            noResults.style.cssText = 'text-align:center;padding:3rem 1rem;color:#9ca3af;font-size:1rem;display:none;';
            noResults.innerHTML = '<div style="font-size:2rem;margin-bottom:0.75rem;">🧵</div><p style="margin:0;">No outfits found for <strong style="color:#1a1a2e;">"' + query + '"</strong>. Try another keyword.</p>';
            var galleryContent = document.getElementById('mt-gallery-search-wrapper');
            if (galleryContent && galleryContent.parentElement) {
              galleryContent.parentElement.appendChild(noResults);
            }
          }

          /* Update no-results message text and visibility */
          var totalVisible = 0;
          for (var k2 in sectionMap) totalVisible += sectionMap[k2].visible;
          noResults.innerHTML = '<div style="font-size:2rem;margin-bottom:0.75rem;">🧵</div><p style="margin:0;">No outfits found for <strong style="color:#1a1a2e;">"' + query + '"</strong>. Try another keyword.</p>';
          noResults.style.display = (q && totalVisible === 0) ? 'block' : 'none';
        }

        function removeSearch() {
          var el = document.getElementById('mt-gallery-search-wrapper');
          if (el) el.remove();
          var nr = document.getElementById('mt-no-results');
          if (nr) nr.remove();
        }

        var retryInterval = setInterval(function () {
          if (window.location.pathname === '/gallery') {
            injectSearch();
            if (searchDone) clearInterval(retryInterval);
          }
        }, 200);
        setTimeout(function () { clearInterval(retryInterval); }, 10000);

        var observer = new MutationObserver(function () {
          if (window.location.pathname === '/gallery' && !searchDone) injectSearch();
        });
        observer.observe(document.body, { childList: true, subtree: true });

        var origPush = history.pushState.bind(history);
        history.pushState = function () {
          origPush.apply(this, arguments);
          searchDone = false;
          clearInterval(retryInterval);
          if (window.location.pathname === '/gallery') {
            retryInterval = setInterval(function () {
              injectSearch();
              if (searchDone) clearInterval(retryInterval);
            }, 200);
            setTimeout(function () { clearInterval(retryInterval); }, 10000);
          } else {
            removeSearch();
          }
        };
        window.addEventListener('popstate', function () {
          searchDone = false;
          if (window.location.pathname !== '/gallery') removeSearch();
        });
      })();
    </script>
    <script>
      (function () {
        // ── Service → gallery query mapping ──────────────────
        var SVC_MAP = {
          "Women's Apparel":        "women",
          "Men's Apparel":          "men",
          "Kids Wear":              "kids",
          "Wedding & Alterations":  "wedding",
          "Lehenga Choli":          "lehenga",
          "Blouse & Padded Blouse": "blouse",
          "Gown & Corset Top":      "gown",
          "Ready to Wear Saree":    "saree",
          "Tops, Bottoms & Blazers":"blazer",
          "Punjabi Dress":          "punjabi",
          "Shirts & Trousers":      "shirt",
          "Kurta & Bandi":          "kurta",
          "Blazers & Suits":        "suit",
          "Frocks & Dresses":       "frock",
          "Kurta Pyjama":           "kurta",
          "Sherwani & Party Wear":  "sherwani",
          "School Uniforms":        "school",
          "Groom's Sherwani":       "sherwani",
          "Bridal Lehenga":         "lehenga",
          "Bridesmaid Outfits":     "bridesmaid",
          "Resizing & Repairs":     "alteration",
          "Emergency Alterations":  "alteration"
        };

        // ── Apply gallery URL filter ──────────────────────────
        function applyGalleryFilter() {
          if (window.location.pathname !== '/gallery') return;
          var q = new URLSearchParams(window.location.search).get('q');
          if (!q) return;
          var attempts = 0;
          var t = setInterval(function () {
            var inp = document.getElementById('mt-gallery-search');
            if (inp) {
              clearInterval(t);
              inp.value = q;
              inp.dispatchEvent(new Event('input', { bubbles: true }));
              var clr = document.getElementById('mt-gallery-clear');
              if (clr) clr.style.display = 'block';
            }
            if (++attempts > 150) clearInterval(t);
          }, 100);
        }

        // ── Inject service links ──────────────────────────────
        function injectServiceLinks() {
          if (window.location.pathname !== '/services') return;
          var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
          var node;
          while ((node = walker.nextNode())) {
            var txt = node.textContent.trim();
            var q = SVC_MAP[txt];
            if (!q) continue;
            var el = node.parentElement;
            if (!el || el.closest('a') || el.dataset.glk) continue;
            el.dataset.glk = '1';
            el.style.cursor = 'pointer';
            el.style.textDecoration = 'underline';
            el.style.textDecorationColor = 'rgba(184,150,46,0.6)';
            el.style.textUnderlineOffset = '3px';
            el.title = 'See in Gallery';
            el.addEventListener('click', (function (query) {
              return function (e) {
                e.preventDefault();
                e.stopPropagation();
                window.location.href = '/gallery?q=' + encodeURIComponent(query);
              };
            }(q)));
          }
        }

        // ── Hook into React Router navigation ────────────────
        var _push = history.pushState.bind(history);
        history.pushState = function () {
          _push.apply(this, arguments);
          applyGalleryFilter();
          setTimeout(injectServiceLinks, 400);
        };
        window.addEventListener('popstate', function () {
          applyGalleryFilter();
          setTimeout(injectServiceLinks, 400);
        });

        // ── Watch DOM for late-rendered content ───────────────
        new MutationObserver(function () {
          if (window.location.pathname === '/services') injectServiceLinks();
        }).observe(document.body, { childList: true, subtree: true });

        applyGalleryFilter();
        setTimeout(injectServiceLinks, 600);
      })();
    </script>
    <script>
      (function () {

          'New':     { bg: '#16a34a', text: '#fff' },
          'Popular': { bg: '#d97706', text: '#fff' }
        };

        function applyBadges(badged) {
          if (!badged || !badged.length) return;
          badged.forEach(function (item) {
            var imgs = document.querySelectorAll('img[alt]');
            imgs.forEach(function (img) {
              var alt = img.getAttribute('alt') || '';
              var src = img.getAttribute('src') || '';
              var matched = alt === item.label || src.indexOf(item.src.split('/').pop()) !== -1;
              if (!matched) return;
              var wrap = img.parentElement;
              if (!wrap || wrap.getAttribute('data-badge-applied')) return;
              wrap.style.position = 'relative';
              wrap.setAttribute('data-badge-applied', '1');
              var pill = document.createElement('span');
              var colors = BADGE_COLORS[item.badge] || { bg: '#2563eb', text: '#fff' };
              pill.style.cssText = [
                'position:absolute',
                'top:8px',
                'left:8px',
                'background:' + colors.bg,
                'color:' + colors.text,
                'font-size:11px',
                'font-weight:700',
                'padding:3px 9px',
                'border-radius:20px',
                'letter-spacing:0.03em',
                'pointer-events:none',
                'z-index:10',
                'box-shadow:0 1px 4px rgba(0,0,0,0.18)'
              ].join(';');
              pill.textContent = item.badge;
              wrap.appendChild(pill);
            });
          });
        }

        fetch('/gallery-badges').then(function (r) { return r.json(); }).then(function (badged) {
          if (!badged.length) return;
          applyBadges(badged);
          var obs = new MutationObserver(function () { applyBadges(badged); });
          obs.observe(document.body, { childList: true, subtree: true });
        }).catch(function () {});
      })();
